<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Javascript Activity</title>
    <link rel="stylesheet" href="style.css">

</head>


<body>

    <div id="wrapper">

            <div class="container" id="">
              <h3>Age Verifier</h3>
                <div class="another-container">
                    <input type="text" id="age" placeholder="Enter an age here">
                    <button id="VerifyAge">Verify Age</button>
                </div>
                <p id="result">RESULT HERE</p>
            </div>

            <div class="container">
                <h3>Odd or Even?</h3>   
                <div class="another-container">
                <input type="text" id="num" placeholder="Enter a Number here">
                <button id="numBtn">Check Number</button>
                </div>    
                <p id="numRes">RESULT HERE</p>
            </div>

            <div class="container">
                <h3>Score Identifier</h3>
                <div class="another-container">
                <input type="text" id="grade" placeholder="Enter a Grade">
                <button id="checkgrade">Identify Score</button>
                </div>  
                <p id="gradeRes">RESULT HERE</p>   
            </div>
    </div>

</body>

    <script src="script.js"></script>

</html>
